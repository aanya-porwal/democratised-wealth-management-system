# Alembic configuration for the Wealth Management System backend.
#
# The database URL is intentionally NOT hardcoded here — it is read from
# the application settings (app.config.settings.DATABASE_URL) so that the
# same migration toolchain works for development, testing and production.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Logging configuration (sqlalchemy's default works fine for local use).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

